<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PR Reviews — Dev Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#f3eee2; --paper-2:#ece4d4; --paper-card:#f7f3ea;
    --ink:#1d1a15; --ink-soft:#554f45; --ink-faint:#948c7d;
    --rule:#d6ccb8; --rule-soft:#e3dac8;
    --accent:#cf4f1c; --accent-deep:#9c3710; --gold:#c2902f;
    --sky:#4d6a73; --green:#4f7a52; --red:#b1473a;
    --shadow:18px 22px 44px -28px rgba(40,30,15,.4);
    --serif:"Bricolage Grotesque",system-ui,sans-serif;
    --sans:"Hanken Grotesk",system-ui,sans-serif;
    --mono:"Geist Mono",ui-monospace,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    line-height:1.5; -webkit-font-smoothing:antialiased; position:relative; min-height:100vh;
  }
  body::after {
    content:""; position:fixed; top:0; left:0; right:0; height:300px; z-index:0; pointer-events:none;
    background:radial-gradient(120% 130% at 78% -28%, rgba(242,193,75,.4) 0%, rgba(224,123,58,.2) 32%, rgba(207,79,28,.05) 55%, transparent 72%);
  }
  .wrap { position:relative; z-index:1; max-width:780px; margin:0 auto; padding:34px 26px 80px; }

  .top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:6px; }
  .top h1 { font-family:var(--serif); font-weight:600; font-size:30px; letter-spacing:-.02em; line-height:1.05; }
  .top .links { display:flex; gap:8px; flex-shrink:0; }
  .top .nav, .refresh {
    font-family:var(--mono); font-size:12.5px; letter-spacing:.04em; color:var(--ink-soft);
    text-decoration:none; border:1px solid var(--rule); padding:7px 13px; white-space:nowrap;
    transition:all .2s ease; background:none; cursor:pointer;
  }
  .top .nav:hover, .refresh:hover { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .refresh.spin { opacity:.6; cursor:default; }
  .sub { font-family:var(--mono); font-size:12.5px; color:var(--ink-faint); letter-spacing:.04em; margin-bottom:18px; }

  .warnbar { background:var(--ink); color:var(--paper); padding:12px 18px; margin-bottom:22px; font-family:var(--mono); font-size:12px; letter-spacing:.03em; }
  .warnbar b { color:var(--gold); }

  .board-h {
    font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:flex-end;
  }
  .board-h .n { color:var(--ink-faint); letter-spacing:.1em; }
  .board-h .h-right { display:flex; gap:12px; align-items:flex-end; }
  .copy-links { font:inherit; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); background:none; border:1px solid var(--rule); padding:2px 7px; cursor:pointer; }
  .copy-links:hover { color:var(--accent-deep); border-color:var(--accent-deep); }
  .board-h.second { margin-top:34px; }

  .card {
    background:var(--paper-card); border:1px solid var(--rule); border-left:4px solid var(--ink-faint);
    padding:18px 22px 16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .card.pending { border-left-color:var(--accent); }
  .card.awaiting-author { border-left-color:var(--gold); }

  /* a PR whose status just moved — held for ALERT_MS so you can catch it on a glance */
  .card.status-changed { background:rgba(207,79,28,.15); box-shadow:inset 0 0 0 1px rgba(207,79,28,.38), var(--shadow); animation:statusPulse 2s ease-in-out infinite; }
  @keyframes statusPulse { 0%,100% { background:rgba(207,79,28,.10); } 50% { background:rgba(207,79,28,.22); } }
  @media (prefers-reduced-motion: reduce) { .status-changed { animation:none; } }
  .sound-hint { font-family:var(--mono); font-size:11.5px; color:var(--accent-deep); cursor:pointer; text-decoration:underline; margin-left:10px; }
  .card.approved { border-left-color:var(--green); }
  .card.changes { border-left-color:var(--red); }
  .card.commented { border-left-color:var(--sky); }
  .card.merged { border-left-color:var(--ink-faint); opacity:.85; }

  .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px; }
  .card-title { font-family:var(--serif); font-size:18px; font-weight:600; letter-spacing:-.01em; line-height:1.3; color:var(--ink); text-decoration:none; }
  .card-title:hover { color:var(--accent-deep); }

  .verdict {
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
    white-space:nowrap; padding:4px 10px; flex-shrink:0;
  }
  .verdict.v-pending    { color:var(--accent); background:rgba(207,79,28,.14); }
  .verdict.v-waiting-author { color:var(--gold); background:rgba(194,144,47,.14); }
  .verdict.v-approved   { color:var(--green); background:rgba(79,122,82,.14); }
  .verdict.v-changes    { color:var(--red); background:rgba(177,71,58,.14); }
  .verdict.v-commented  { color:var(--sky); background:rgba(77,106,115,.14); }
  .verdict.v-none       { color:var(--ink-faint); background:rgba(0,0,0,.05); }

  .meta-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); }
  .pill {
    font-family:var(--mono); font-size:11.5px; letter-spacing:.02em; padding:4px 9px;
    background:var(--paper-2); border:1px solid var(--rule); color:var(--ink-soft);
  }
  .pill.state-open    { color:var(--gold); background:rgba(194,144,47,.14); border-color:transparent; }
  .pill.state-merged   { color:var(--green); background:rgba(79,122,82,.14); border-color:transparent; }
  .pill.state-closed  { color:var(--red); background:rgba(177,71,58,.13); border-color:transparent; }
  .pill.draft { font-style:italic; }
  .updated { font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
  .facts {
    display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; margin-top:10px;
    font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
  }
  .facts .lab { color:var(--ink-faint); }
  .facts .none { color:var(--ink-faint); font-style:italic; }

  .empty { font-family:var(--mono); font-size:13px; color:var(--ink-faint); padding:30px 0; text-align:center; }
  .everything {
    display:block; text-align:center; font-family:var(--mono); font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); text-decoration:none;
    border:1px dashed var(--rule); padding:15px; margin-top:24px; transition:all .2s ease;
  }
  .everything:hover { background:var(--paper-card); border-color:var(--ink-faint); color:var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>PR Reviews</h1>
      <div class="links">
        <button class="refresh" id="refreshBtn">↻ refresh</button>
        <a class="nav" href="/tracker.html">◈ Feature Tracker</a>
        <a class="nav" href="/focus.html">≡ Where am I</a>
        <a class="nav" href="/dev-dispatch.html">≡ Full dashboard</a>
      </div>
    </div>
    <div class="sub" id="sub">loading your review queue…<span class="sound-hint" id="soundHint" style="display:none;" title="browsers mute audio until you interact with the page">🔔 click to enable sound</span></div>

    <div class="warnbar" id="warnbar" style="display:none"></div>

    <div class="board-h">Waiting on you <span class="h-right"><button class="copy-links" data-list="pendingBoard" title="copy every PR link in this section, in the order shown">copy links</button><span class="n" id="pendingN"></span></span></div>
    <div id="pendingBoard"><div class="empty">Fetching…</div></div>

    <div class="board-h second">Waiting on the author <span class="h-right"><button class="copy-links" data-list="authorBoard" title="copy every PR link in this section, in the order shown">copy links</button><span class="n" id="authorN"></span></span></div>
    <div id="authorBoard"><div class="empty">Fetching…</div></div>

    <div class="board-h second">Already reviewed <span class="h-right"><button class="copy-links" data-list="doneBoard" title="copy every PR link in this section, in the order shown">copy links</button><span class="n" id="doneN"></span></span></div>
    <div id="doneBoard"><div class="empty">Fetching…</div></div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  // "copy links" button: the PR links in a section, in the order shown, one per line
  function copyLinks(btn, list, selector){
    const links = [...new Set([...list.querySelectorAll(selector)].map(a => a.href).filter(h => h.includes("/pull/")))];
    const label = btn.textContent;
    const say = t => { btn.textContent = t; setTimeout(() => { btn.textContent = label; }, 1500); };
    if (!links.length) return say("no PRs");
    navigator.clipboard.writeText(links.join("\n")).then(() => say(`copied ${links.length}`), () => say("copy failed"));
  }
  document.querySelectorAll(".copy-links").forEach(b => b.addEventListener("click", () =>
    copyLinks(b, $(b.dataset.list), ".card-title")));
  const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function ago(iso){
    if (!iso) return "never";
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return "just now";
    if (s < 3600) return Math.round(s/60) + "m ago";
    if (s < 86400) return Math.round(s/3600) + "h ago";
    return Math.round(s/86400) + "d ago";
  }

  const VERDICT_LABEL = {
    APPROVED: "✅ Approved", CHANGES_REQUESTED: "🔴 Changes requested", COMMENTED: "💬 Commented",
  };
  const VERDICT_CLASS = {
    APPROVED: "v-approved", CHANGES_REQUESTED: "v-changes", COMMENTED: "v-commented",
  };

  function cardClass(c){
    if (c.pendingReview) return "pending";
    if (c.awaitingAuthor) return "awaiting-author";
    if (c.state === "MERGED") return "merged";
    if (c.myVerdict === "CHANGES_REQUESTED") return "changes";
    if (c.myVerdict === "APPROVED") return "approved";
    return "commented";
  }

  function statePill(c){
    const cls = c.state === "MERGED" ? "state-merged" : c.state === "CLOSED" ? "state-closed" : "state-open";
    const label = c.state === "MERGED" ? "Merged" : c.state === "CLOSED" ? "Closed" : "Open";
    return `<span class="pill ${cls}">${label}</span>`;
  }

  function verdictBadge(c){
    if (c.needsReply) return `<span class="verdict v-pending">💬 Author replied — take another look</span>`;
    if (c.pendingReview) return `<span class="verdict v-pending">👀 Awaiting your review</span>`;
    if (c.awaitingAuthor) return `<span class="verdict v-waiting-author">⏳ Waiting on author</span>`;
    if (c.myVerdict && VERDICT_LABEL[c.myVerdict]) {
      return `<span class="verdict ${VERDICT_CLASS[c.myVerdict]}">${VERDICT_LABEL[c.myVerdict]}</span>`;
    }
    return `<span class="verdict v-none">— reviewed</span>`;
  }

  function renderCard(c){
    return `<div class="card ${cardClass(c)}${flashing(c.url) ? " status-changed" : ""}" data-key="${esc(c.url)}">
      <div class="card-head">
        <a class="card-title" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
        ${verdictBadge(c)}
      </div>
      <div class="meta-row">
        <span class="pill">${esc(c.repo)} #${esc(String(c.number))}</span>
        ${statePill(c)}
        ${c.isDraft ? `<span class="pill draft">draft</span>` : ""}
        <span class="pill">by ${esc(c.author)}</span>
        <span class="updated">updated ${ago(c.updatedAt)}</span>
      </div>
      ${factsBlock(c)}
    </div>`;
  }

  // reviewers with their latest verdict, same marks as the feature tracker's side panels
  const REVIEW_MARK = {
    APPROVED: ["✅", "approved"], CHANGES_REQUESTED: ["❗", "requested changes"],
    COMMENTED: ["💬", "commented"], REQUESTED: ["⏳", "review requested, not done yet"],
    DISMISSED: ["⊘", "review dismissed"],
  };
  // under a day old reads as "3h ago"; older shows the date with the age in parentheses
  function sinceStamp(iso){
    const t = new Date(iso), days = Math.floor((Date.now() - t.getTime()) / 86400000);
    if (days < 1) return ago(iso);
    const when = t.toLocaleString("en-US", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false });
    return `${when} (${days === 1 ? "1 day" : days + " days"} ago)`;
  }
  function stamp(iso, missing){
    return iso ? `<span title="${esc(iso)}">${esc(sinceStamp(iso))}</span>` : `<span class="none">${missing}</span>`;
  }
  // "review by / opened / code updated / last review", one row each, inside the card
  function factsBlock(c){
    const revs = c.reviewers || [];
    const names = revs.length ? revs.map(rv => {
      const [mark, label] = REVIEW_MARK[rv.state] || ["", (rv.state || "").toLowerCase()];
      return `<span title="${esc(rv.login)}: ${esc(label)}">${esc(rv.name)}${mark ? " " + mark : ""}</span>`;
    }).join(" · ") : `<span class="none">nobody yet</span>`;
    return `<div class="facts">
        <span class="lab">review by</span><span>${names}</span>
        <span class="lab">opened</span>${stamp(c.createdAt, "unknown")}
        <span class="lab">code updated</span>${stamp(c.lastCommitAt, "unknown")}
        <span class="lab">last review</span>${stamp(c.lastReviewAt, "none yet")}
      </div>`;
  }


  /* ---------------------------------------------------------------------
     Status-change alerts.
     Every poll we build {key -> status} and compare it to the last one we
     told you about. Anything that moved gets a beep (one per refresh, no
     matter how many moved) and a tint held for ALERT_MS.

     The seen-map lives in localStorage so a reload doesn't re-announce the
     whole board; the flash-map is plain memory so two open tabs don't fight
     over each other's timers and a reload doesn't restore a glow you already
     saw. The very first run has no baseline, so it records silently.
  --------------------------------------------------------------------- */
  const ALERT_MS = 30000;
  const SEEN_KEY = "dd.reviews.seen";
  const FLASH = new Map();     // key -> expiry epoch ms
  let flashTimer = null;
  let suppressAlert = false;   // set before a render we caused ourselves

  let audioCtx = null;
  function ac(){
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
    return audioCtx;
  }
  // Browsers keep an AudioContext suspended until the page has been interacted with, and
  // this dashboard sits open on a second monitor for hours — grab the first gesture we get.
  ["click","keydown"].forEach(ev => window.addEventListener(ev, () => {
    const c = ac();
    if (c && c.state === "suspended") c.resume().then(() => { $("soundHint").style.display = "none"; }, () => {});
  }, {passive:true}));

  function beep(){
    const c = ac();
    // Can't play yet — say so rather than failing silently, or a missed alert reads as a
    // broken feature.
    if (!c || c.state !== "running") { $("soundHint").style.display = ""; return; }
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, t);
    o.frequency.setValueAtTime(1175, t + 0.11);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.36);
  }

  // What "status" means on this page: which bucket the card sits in plus the badge it shows.
  function statusOf(c){
    return [c.state, c.pendingReview ? 1 : 0, c.awaitingAuthor ? 1 : 0, c.needsReply ? 1 : 0, c.myVerdict || ""].join("|");
  }

  function flashing(key){
    const until = FLASH.get(key);
    if (!until) return false;
    if (until <= Date.now()) { FLASH.delete(key); return false; }
    return true;
  }

  function paintFlashes(){
    document.querySelectorAll(".card[data-key]").forEach(el => {
      el.classList.toggle("status-changed", flashing(el.dataset.key));
    });
  }

  function sweepFlashes(){
    clearTimeout(flashTimer);
    if (!FLASH.size) return;
    const next = Math.min(...FLASH.values()) - Date.now();
    flashTimer = setTimeout(() => { paintFlashes(); sweepFlashes(); }, Math.max(next, 250));
  }

  function noteChanges(cards){
    const now = {};
    cards.forEach(c => { now[c.url] = statusOf(c); });
    let prev = null;
    try { const raw = localStorage.getItem(SEEN_KEY); prev = raw ? JSON.parse(raw) : null; } catch(e){}
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(now)); } catch(e){}
    if (suppressAlert) { suppressAlert = false; return; }
    if (!prev) return;   // first ever run on this browser — baseline only
    const changed = Object.keys(now).filter(k => !(k in prev) || prev[k] !== now[k]);
    if (!changed.length) return;
    const until = Date.now() + ALERT_MS;
    changed.forEach(k => FLASH.set(k, until));
    beep();
    sweepFlashes();
  }

  function renderBoard(d){
    const cards = d.cards || [];
    noteChanges(cards);
    const pending = cards.filter(c => c.pendingReview);
    const awaitingAuthor = cards.filter(c => !c.pendingReview && c.awaitingAuthor);
    const done = cards.filter(c => !c.pendingReview && !c.awaitingAuthor);

    $("pendingN").textContent = pending.length ? String(pending.length) : "";
    $("pendingBoard").innerHTML = pending.length
      ? pending.map(renderCard).join("")
      : `<div class="empty">Nothing waiting on you right now.</div>`;

    $("authorN").textContent = awaitingAuthor.length ? String(awaitingAuthor.length) : "";
    $("authorBoard").innerHTML = awaitingAuthor.length
      ? awaitingAuthor.map(renderCard).join("")
      : `<div class="empty">Nothing waiting on an author right now.</div>`;

    $("doneN").textContent = done.length ? String(done.length) : "";
    $("doneBoard").innerHTML = done.length
      ? done.map(renderCard).join("")
      : `<div class="empty">No review history found.</div>`;

    $("sub").firstChild.nodeValue = "last synced " + ago(d.fetchedAt);
    $("sub").dataset.fetchedAt = d.fetchedAt || "";
    paintFlashes();

    const warn = $("warnbar");
    if (d.error) { warn.style.display = "block"; warn.innerHTML = `Last fetch error: <b>${esc(d.error)}</b>`; }
    else warn.style.display = "none";
  }

  // The server answers from its cache, so this is normally instant. Only the first request
  // after a server start waits for a full build (~20s); past LOAD_TIMEOUT_MS something is
  // wrong, so say so instead of leaving "Fetching…" up forever. Returns the payload, or null.
  const LOAD_TIMEOUT_MS = 45000;
  async function loadReviews(){
    let d;
    try {
      const r = await fetch("/api/reviews", {cache:"no-store", signal: AbortSignal.timeout(LOAD_TIMEOUT_MS)});
      d = await r.json();
    } catch(e){
      $("sub").firstChild.nodeValue = e.name === "TimeoutError"
        ? "server is slow to answer — retrying on the next poll"
        : "couldn't reach the server";
      return null;
    }
    try { renderBoard(d); }
    catch(e){
      const warn = $("warnbar");
      warn.style.display = "block";
      warn.innerHTML = `Couldn't draw the board: <b>${esc(String(e && e.message || e))}</b>`;
    }
    return d;
  }

  // The refresh click starts a rebuild on the server and returns at once; the board keeps
  // showing the previous build until one with a newer fetchedAt comes back.
  const REFRESH_POLL_MS = 2000, REFRESH_MAX_MS = 90000;
  async function refreshNow(){
    const b = $("refreshBtn");
    if (b.disabled) return;
    b.classList.add("spin"); b.disabled = true; b.textContent = "↻ refreshing…";
    const before = $("sub").dataset.fetchedAt || "";
    try { await fetch("/api/reviews/refresh", {method:"POST"}); } catch(e){}
    const giveUpAt = Date.now() + REFRESH_MAX_MS;
    while (Date.now() < giveUpAt) {
      await new Promise(res => setTimeout(res, REFRESH_POLL_MS));
      const d = await loadReviews();
      if (d && d.fetchedAt && d.fetchedAt !== before && !d.refreshing) break;
    }
    b.classList.remove("spin"); b.textContent = "↻ refresh"; b.disabled = false;
  }
  $("refreshBtn").addEventListener("click", refreshNow);

  loadReviews();
  setInterval(loadReviews, 60000);
</script>
</body>
</html>
